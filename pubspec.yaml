name: my_crm
description: "A lightweight offline CRM for local business outreach."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.3
  file_picker: ^11.0.3
  csv: ^8.0.0
  url_launcher: ^6.3.2
  google_fonts: ^8.2.0
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  flutter_slidable: ^4.0.3
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
